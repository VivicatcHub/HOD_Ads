    <style>
      .boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 90% at 50% 45%, #2e1752 0%, #170830 70%), #170830;
      }
      .boot-splash img {
        width: min(38vmin, 220px);
        height: auto;
        filter: drop-shadow(0 8px 28px rgba(163, 10, 245, 0.5));
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.6;
          transform: scale(0.96);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash img {
          animation: none;
        }
      }
    </style>

    <div id="root">

      </div>
